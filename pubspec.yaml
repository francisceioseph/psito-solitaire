name: psito_solitaire
description: "Classic solitaire with cockatiels. No ads, no telemetry, no account."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/cards/
    - assets/mascot/
    - assets/slots/
  fonts:
    - family: CardSerif
      fonts:
        - asset: assets/fonts/CardSerif-Bold.ttf
